# No `[run] bun = true`. It symlinks `node` to Bun for package.json scripts and every
# process they spawn, and Playwright's test runner cannot survive that: its workers
# never report and `bun run test:e2e` hangs with no output. Bun still runs the tests
# (`bun test`) and the content gates (`bun scripts/*.ts`); node-shebanged binaries
# (astro, biome, playwright) get Node, which is what they are built for.

# Isolated installs — strict, symlinked node_modules (like pnpm), no phantom deps.
[install]
linker = "isolated"

# Only re-print failing tests on reruns.
[test]
onlyFailures = true
