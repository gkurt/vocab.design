name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
        env:
          NODE_ENV: production
          SITE: https://gkurt.com
          BASE_URL: /vocab.design
          # Set the repository variable PUBLIC_GA_ID (Settings > Variables) to a GA4
          # measurement ID, G-XXXXXXXXXX. Unset means the deploy carries no analytics at
          # all, which is also what every other build does.
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
