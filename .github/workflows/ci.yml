name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The specimen suite is NOT here: it is ~45 minutes per run, which exhausts the Actions
# budget on a private repo. It lives in e2e.yml, manual only.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun check
      - run: bun run test
      - run: bun typecheck
      - run: bun validate
      - run: bun run build

