name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun check
      - run: bun run test
      - run: bun typecheck
      - run: bun validate
      - run: bun run build

  specimens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bunx playwright install --with-deps chromium
      # Executes every choreography against the built site and photographs each
      # specimen with identify engaged (SPEC §8).
      - run: bun run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identify-contact-sheet
          path: e2e/__artifacts__
          if-no-files-found: warn
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.report
